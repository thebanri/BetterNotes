[workspace]
members = ["app", "crates/core"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2021"
publish = false

[workspace.dependencies]
cxx = "1"
cxx-qt = "=0.9.0"
cxx-qt-lib = { version = "=0.9.0", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = "=0.9.0"
rusqlite = "0.40.2"
thiserror = "1.0.69"
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
zeroize = "1"
