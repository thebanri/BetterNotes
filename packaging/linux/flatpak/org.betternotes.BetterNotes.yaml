id: org.betternotes.BetterNotes
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: betternotes

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Desktop notifications for reminders.
  - --talk-name=org.freedesktop.Notifications
  # System tray icon (StatusNotifierItem). Qt names its item
  # org.kde.StatusNotifierItem-<pid>-<n>, which no own-name wildcard can
  # express short of all of org.kde.*; without it the item registers with
  # the watcher under the connection's unique name.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The app's own bus name (org.betternotes.BetterNotes) needs no permission.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/betternotes/cargo
  # Cargo downloads the crates during the build. That is fine for the bundle
  # the release workflow publishes; Flathub builds offline and would need the
  # crates listed as sources instead (flatpak-cargo-generator).
  build-args:
    - --share=network

modules:
  # Notes become desktop widgets on Wayland through LayerShellQt, which the
  # KDE runtime does not include. extra-cmake-modules is only needed to build
  # it.
  - name: extra-cmake-modules
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_HTML_DOCS=OFF
      - -DBUILD_MAN_DOCS=OFF
      - -DBUILD_QTHELP_DOCS=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://download.kde.org/stable/frameworks/6.14/extra-cmake-modules-6.14.0.tar.xz
        sha256: d02cbbb3269b39680884abf6f14ba68f448570c554173f5249da3b8761784c13

  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - /include
      - /lib/cmake
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.4.5/layer-shell-qt-6.4.5.tar.xz
        sha256: ef6baae22114f038af89029f3f0075ee29c3b91fd49100828c4c3a32e1496e95

  - name: betternotes
    buildsystem: simple
    build-options:
      env:
        BETTERNOTES_LAYER_SHELL_PREFIX: /app
    build-commands:
      - cargo build --release --locked -p betternotes
      - install -Dm755 target/release/betternotes /app/bin/betternotes
      - install -Dm644 packaging/linux/org.betternotes.BetterNotes.desktop /app/share/applications/org.betternotes.BetterNotes.desktop
      - install -Dm644 packaging/linux/org.betternotes.BetterNotes.metainfo.xml /app/share/metainfo/org.betternotes.BetterNotes.metainfo.xml
      - install -Dm644 assets/icons/org.betternotes.BetterNotes.svg /app/share/icons/hicolor/scalable/apps/org.betternotes.BetterNotes.svg
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - betternotes_markdown_export
