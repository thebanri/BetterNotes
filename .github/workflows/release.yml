name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux Release Binary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            libqt6core6 \
            libqt6gui6 \
            libqt6qml6 \
            libqt6quick6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          mkdir -p release-dist/betternotes-x86_64
          cp target/release/betternotes release-dist/betternotes-x86_64/
          cp packaging/linux/org.betternotes.BetterNotes.desktop release-dist/betternotes-x86_64/
          cp packaging/linux/org.betternotes.BetterNotes.metainfo.xml release-dist/betternotes-x86_64/
          cp assets/icons/org.betternotes.BetterNotes.svg release-dist/betternotes-x86_64/
          cp LICENSE README.md release-dist/betternotes-x86_64/
          tar -czvf betternotes-linux-x86_64.tar.gz -C release-dist betternotes-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: betternotes-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
