name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Debian 13, Qt 6.8)
    runs-on: ubuntu-24.04
    # The app needs Qt 6.5 or newer; Ubuntu 24.04 ships 6.4.
    container: debian:trixie
    env:
      QMAKE: /usr/lib/qt6/bin/qmake
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates git \
            libsqlite3-dev \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-qpa-plugins \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-shapes \
            qml6-module-qt-labs-platform qml6-module-qt-labs-folderlistmodel \
            qml6-module-qttest

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked
